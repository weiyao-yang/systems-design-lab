<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5c9dc">
  <meta name="description" content="Systems Design Lab 系统设计实验室 — 在系统、物体与交互之间，探索新的连接。蓝橙机械臂互动空间。">
  <title>Systems Design Lab · 系统设计实验室</title>
  <link rel="icon" href="assets/tic-tac-toe.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=44">
</head>
<body class="booting">
  <main id="lab" class="lab">
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="系统设计实验室首页"><svg class="brand-mark" viewBox="8 10 104 100" aria-hidden="true" focusable="false"><image href="assets/tic-tac-toe.svg" width="120" height="120"/></svg><span>SYSTEMS<br>DESIGN LAB<span class="brand-cn">系统设计实验室</span></span></a>
      <div class="topbar-right"><div class="topbar-controls"><button id="soundToggle" class="sound-toggle" aria-label="Enable sound / 开启音效" aria-pressed="false"><span class="sound-bars"><i></i><i></i><i></i><i></i></span><span id="soundState">SOUND OFF</span></button><button class="reboot" id="reboot" aria-label="Reboot introduction / 重新播放开屏"><span class="reboot-icon" aria-hidden="true">↻</span><span>REBOOT</span></button></div></div>
    </header>
    <div class="hero-heading" aria-label="Systems Design Lab"><h1>SYSTEMS<span>DESIGN LAB<img class="title-star" src="assets/tic-tac-toe.svg" alt="" aria-hidden="true"></span></h1></div>
    <div class="scene" id="scene"><canvas id="robotCanvas" aria-label="蓝橙配色的轮式机械臂，悬停标签时向对应位置伸展" role="img"></canvas><div class="scene-fallback" hidden><span>✳</span><p>SDL—01<br>机械臂展示需要启用 WebGL</p></div></div>
    <nav class="orbit-nav" aria-label="探索实验室">
      <button class="orbit-tag left t1" data-panel="projects" data-side="left"><span class="tag-index">01</span><span class="tag-title">NEWS<small lang="zh-CN">新闻动态</small></span><span class="tag-arrow">↗</span></button>
      <button class="orbit-tag left t2" data-panel="systems" data-side="left"><span class="tag-index">02</span><span class="tag-title">ABOUT THE LAB<small lang="zh-CN">关于实验室</small></span><span class="tag-arrow">↗</span></button>
      <button class="orbit-tag left t3" data-panel="prototypes" data-side="left"><span class="tag-index">03</span><span class="tag-title">PUBLICATION<small lang="zh-CN">学术出版物</small></span><span class="tag-arrow">↗</span></button>
      <button class="orbit-tag right t1" data-panel="about" data-side="right"><span class="tag-index">04</span><span class="tag-title">PEOPLE<small lang="zh-CN">团队成员</small></span><span class="tag-arrow">↗</span></button>
      <button class="orbit-tag right t2" data-panel="journal" data-side="right"><span class="tag-index">05</span><span class="tag-title">PROJECT<small lang="zh-CN">研究项目</small></span><span class="tag-arrow">↗</span></button>
      <button class="orbit-tag right t3" data-panel="contact" data-side="right"><span class="tag-index">06</span><span class="tag-title">LET'S CONNECT<small lang="zh-CN">联系与合作</small></span><span class="tag-arrow">↗</span></button>
    </nav>
  </main>

  <dialog id="bootDialog" class="boot-dialog intro-dialog" aria-labelledby="bootTitle" aria-describedby="introStatus" tabindex="-1">
    <section class="intro-stream" aria-label="Live data visualization">
      <div class="intro-stream-heading"><span><i></i><span id="introPhase">INCOMING DATA</span></span><span id="introCount">00000</span></div>
      <div id="introData" class="intro-data" aria-hidden="true"></div>
      <div class="intro-stream-footer"><span id="introStatus" role="status">LISTENING FOR CONNECTIONS</span><span id="introProgress" aria-hidden="true">00%</span></div>
    </section>
    <div class="intro-copy">
      <h2 id="bootTitle"><span>SYSTEMS</span><span>DESIGN LAB</span></h2>
      <div class="intro-enter-row"><button id="enterButton" class="intro-enter" aria-label="Enter Systems Design Lab / 进入系统设计实验室" disabled><span>Enter</span><span class="intro-enter-arrow" aria-hidden="true">↵</span></button><span class="intro-continue">To Continue</span></div>
    </div>
  </dialog>

  <dialog id="contentDialog" class="content-dialog" aria-labelledby="panelTitle"><div id="panelShell" class="panel-shell" tabindex="-1"><div class="panel-top"><span id="panelEyebrow"></span><button id="closePanel" class="close-panel" aria-label="Close panel / 关闭弹窗"><span class="close-icon" aria-hidden="true">✕</span><span class="close-shortcut">ESC</span></button></div><div id="panelContent" class="panel-content"></div><div class="panel-bottom"><span>SYSTEMS DESIGN LAB / EXPLORATION MODE</span><button id="nextPanel">NEXT CONNECTION <span>↗</span><small class="zh-copy">下一个连接</small></button></div></div></dialog>
  <script type="module" src="app.js?v=44"></script>
</body>
</html>
